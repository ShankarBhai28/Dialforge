<VirtualHost *:8443>
    ServerName dialforge.ddnsfree.com
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/dialforge.ddnsfree.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/dialforge.ddnsfree.com/privkey.pem

    <Directory /var/www/html/phpmyadmin>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
