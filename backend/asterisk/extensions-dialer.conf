; DialForge dialer: where a customer goes once they answer a call the
; dialer engine placed (engine sets the variables, then continues here).
; Included from extensions.conf with:  #include extensions-dialer.conf
;
;   QUEUENAME          campaign's Asterisk queue
;   DIALER_ATTEMPT_ID  dial_attempts.id, reported back via UserEvent
;   DIALER_MAXWAIT     seconds to wait for a free agent before abandoning
;   DIALER_AMD         1 = run answering-machine detection first
;
; Reaching the line after Queue() means no agent took the call (Queue()
; ends the channel itself after a connected call), so it's an abandon.
; The backend listens for the UserEvent over AMI and records the result.
[dialer-answered]
exten => s,1,NoOp(DialForge dialer attempt ${DIALER_ATTEMPT_ID} -> queue ${QUEUENAME})
 same => n,GotoIf($["${DIALER_AMD}" = "1"]?amd:queue)
 same => n(amd),AMD()
 same => n,NoOp(AMD: ${AMDSTATUS} / ${AMDCAUSE})
 same => n,GotoIf($["${AMDSTATUS}" = "MACHINE"]?machine:queue)
 same => n(queue),Queue(${QUEUENAME},,,,${DIALER_MAXWAIT})
 same => n,NoOp(No agent took the call: ${QUEUESTATUS})
 same => n,UserEvent(DialForgeDialer,Attempt: ${DIALER_ATTEMPT_ID},Result: abandoned,QueueStatus: ${QUEUESTATUS})
 ; Placeholder prompt - replace with a recorded "sorry we missed you,
 ; we'll call you back" message before going live.
 same => n,Playback(tt-allbusy)
 same => n,Hangup()
 same => n(machine),UserEvent(DialForgeDialer,Attempt: ${DIALER_ATTEMPT_ID},Result: machine)
 same => n,Hangup()
