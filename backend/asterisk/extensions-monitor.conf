; DialForge call monitoring (Live Agents -> Listen / Whisper / Barge).
; Installed as /etc/asterisk/extensions-monitor.conf, pulled in by
; "#include extensions-monitor.conf" at the end of extensions.conf.
;
; The backend (AMI Originate, src/services/monitor.js) calls the
; supervisor's monitoring line - auto-answered in their browser - into this
; context with EXTEN = the agent's extension and DF_SPY_OPTS = ChanSpy
; options set by the backend only:
;   q  no beep / announcement (the agent and customer aren't told)
;   E  hang up when the agent's call ends
;   d  the supervisor switches mode with keys: 4 listen, 5 whisper, 6 barge
;   w  start whispering (agent hears the supervisor, customer doesn't)
;   B  start barged in (both hear the supervisor)
; Nothing can dial into this context: no endpoint has it as its context.
[df-monitor]
; Cloud edition: the agent's line is <company>_<extension>, hence letters too.
exten => _[0-9a-z].,1,NoOp(DialForge monitor: agent ${EXTEN}, options ${DF_SPY_OPTS})
 same => n,Answer()
 same => n,ChanSpy(PJSIP/${EXTEN}-,${DF_SPY_OPTS})
 same => n,Hangup()
