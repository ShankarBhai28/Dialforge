; VIZTEX Cloud edition: the browser phones of every company
; (docs/plans/TENANTS_PLAN.md part 3). Installed as
; /etc/asterisk/extensions-tenants.conf, pulled in by
; "#include extensions-tenants.conf" at the end of extensions.conf.
;
; On a multi-tenant install Asterisk knows each company's extension 1001 as
; <company>_1001 (company codes never contain "_"), and every such line has
; this context. A number dialed from it stays inside the caller's company:
; the company is read from the caller's own endpoint name.
; Single-customer installs never use this context (their lines are in [internal]).
[tenant-internal]
exten => 9000,1,NoOp(Entering ARI Stasis app)
 same => n,Stasis(dialforge-app)
 same => n,Hangup()
exten => _X.,1,NoOp(Extension to extension inside company ${CUT(CHANNEL(endpoint),_,1)})
 same => n,Set(DF_COMPANY=${CUT(CHANNEL(endpoint),_,1)})
 same => n,GotoIf($["${DF_COMPANY}" = ""]?nocompany)
 same => n,Dial(PJSIP/${DF_COMPANY}_${EXTEN},20)
 same => n,Hangup()
 same => n(nocompany),Hangup()
