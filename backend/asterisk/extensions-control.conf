; DialForge call control (transfer / conference).
; Installed as /etc/asterisk/extensions-control.conf, pulled in by
; "#include extensions-control.conf" at the end of extensions.conf.
;
; A call that native Queue() connected is not in our ARI app, so the
; backend can't move it around. To transfer or conference it, the backend
; AMI-redirects both legs here, which puts them into the dialforge-app
; Stasis app where they get bridged again under its control (a short gap
; in audio, well under a second).
;   cus<callId> = the customer's leg, agt<callId> = the agent's leg
; (prefixes avoid the letters N/X/Z, which are pattern characters)
[df-control]
exten => _cus.,1,NoOp(DialForge call control: call ${EXTEN:3} customer leg)
 same => n,Stasis(dialforge-app,adopt,${EXTEN:3},cust)
 same => n,Hangup()

exten => _agt.,1,NoOp(DialForge call control: call ${EXTEN:3} agent leg)
 same => n,Stasis(dialforge-app,adopt,${EXTEN:3},agent)
 same => n,Hangup()
