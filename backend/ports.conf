# If you just change the port or add more ports here, you will likely also
# have to change the VirtualHost statement in
# /etc/apache2/sites-enabled/000-default.conf

Listen 80

# NOTE: port 443 is intentionally NOT listened on here - it's already used
# by coturn's TURNS listener (see RUNBOOK.md Phase 0, section 9). Apache
# only serves plain HTTP on 80 (redirects /phpmyadmin to 8443) and HTTPS
# on 8443 for phpMyAdmin.
Listen 8443
