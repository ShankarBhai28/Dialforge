<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DialForge Phase-0 Test</title>
<script src="https://cdn.jsdelivr.net/npm/jssip@3/dist/jssip.min.js"></script>
<style>
  body { font-family: sans-serif; max-width: 520px; margin: 20px auto; padding: 0 16px; }
  label { display: block; margin-top: 8px; font-size: 13px; }
  input { width: 100%; padding: 6px; box-sizing: border-box; }
  button { margin-top: 10px; padding: 8px 14px; }
  #log { background: #111; color: #0f0; font: 12px monospace; height: 220px; overflow-y: auto; padding: 8px; margin-top: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<h2>Phase-0 WebRTC test</h2>

<!-- Nothing secret is hardcoded: you type passwords at test time, so this
     file is safe to commit and to leave on the server. -->
<label>Hostname (must match the TLS cert)<input id="host" placeholder="dialforgetest.ddnsfree.com"></label>
<label>My extension<input id="ext" placeholder="1001"></label>
<label>SIP password (from pjsip.conf)<input id="pass" type="password"></label>
<label>TURN server IP (Elastic IP)<input id="turnIp" placeholder="65.1.59.100"></label>
<label>TURN username (turnserver.conf user=...)<input id="turnUser" placeholder="dialforge"></label>
<label>TURN password<input id="turnPass" type="password"></label>
<label><input id="relayOnly" type="checkbox" style="width:auto"> Force TURN relay only (tests coturn in isolation)</label>
<button onclick="register()">Register</button>

<hr>
<label>Call extension<input id="target" placeholder="1002"></label>
<button onclick="call()">Call</button>
<button onclick="answer()">Answer</button>
<button onclick="hangup()">Hang up</button>

<audio id="remoteAudio" autoplay></audio>
<div id="log"></div>

<script>
let ua = null, session = null;
const $ = id => document.getElementById(id);
const log = msg => { $('log').textContent += new Date().toLocaleTimeString() + '  ' + msg + '\n'; $('log').scrollTop = 1e9; };

function pcConfig() {
  return {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'turn:' + $('turnIp').value.trim() + ':3478', username: $('turnUser').value.trim(), credential: $('turnPass').value },
    ],
    iceTransportPolicy: $('relayOnly').checked ? 'relay' : 'all',
  };
}

function register() {
  const host = $('host').value.trim(), ext = $('ext').value.trim();
  if (ua) ua.stop();
  const socket = new JsSIP.WebSocketInterface('wss://' + host + ':8089/ws');
  ua = new JsSIP.UA({ sockets: [socket], uri: 'sip:' + ext + '@' + host, password: $('pass').value });
  ua.on('connected', () => log('WebSocket connected'));
  ua.on('disconnected', () => log('WebSocket DISCONNECTED (check http.conf / port 8089 / cert hostname)'));
  ua.on('registered', () => log('REGISTERED as ' + ext));
  ua.on('registrationFailed', e => log('Registration FAILED: ' + e.cause));
  ua.on('newRTCSession', data => {
    session = data.session;
    log((data.originator === 'remote' ? 'INCOMING call from ' : 'Calling ') + session.remote_identity.uri.user);
    session.on('accepted', () => log('Call CONNECTED - speak now, check audio both ways'));
    session.on('ended', e => { log('Call ended: ' + e.cause); session = null; });
    session.on('failed', e => { log('Call FAILED: ' + e.cause); session = null; });
    // The RTCPeerConnection can exist before this listener attaches (outgoing)
    // or only after answer() (incoming) - handle both timings.
    session.on('peerconnection', d => watchPc(d.peerconnection));
    if (session.connection) watchPc(session.connection);
    // JsSIP holds the INVITE / 200 OK until ICE gathering fully completes, which
    // on PCs with VPN/virtual adapters can take 20-40s - longer than Dial()'s
    // 20s ring timeout. Send as soon as we have a usable candidate, or after 3s.
    let iceTimer = null, iceSent = false;
    const sendNow = (e, why) => { if (iceSent) return; iceSent = true; clearTimeout(iceTimer); log(why); e.ready(); };
    session.on('icecandidate', e => {
      const t = e.candidate.type;
      if (t === 'srflx' || t === 'relay') return sendNow(e, 'Usable ICE candidate (' + t + ') - sending SDP now');
      if (!iceTimer) iceTimer = setTimeout(() => sendNow(e, 'ICE gathering slow - sending SDP after 3s'), 3000);
    });
  });
  ua.start();
}

function watchPc(pc) {
  if (pc._watched) return;
  pc._watched = true;
  pc.addEventListener('track', e => { $('remoteAudio').srcObject = e.streams[0]; log('Remote audio track attached'); });
  pc.addEventListener('icecandidate', e => { if (e.candidate) log('local ICE candidate: ' + e.candidate.type + ' ' + e.candidate.address); });
  pc.addEventListener('iceconnectionstatechange', async () => {
    log('ICE state: ' + pc.iceConnectionState);
    if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
      // Report which path media actually took: host/srflx = direct, relay = through coturn.
      const stats = await pc.getStats();
      stats.forEach(r => {
        if (r.type === 'candidate-pair' && r.state === 'succeeded' && r.nominated) {
          const l = stats.get(r.localCandidateId), rm = stats.get(r.remoteCandidateId);
          log('Media path: local ' + l.candidateType + ' -> remote ' + rm.candidateType + ' ' + rm.address + ':' + rm.port);
        }
      });
    }
  });
}

function call() {
  if (!ua) return log('Register first');
  ua.call('sip:' + $('target').value.trim() + '@' + $('host').value.trim(), {
    mediaConstraints: { audio: true, video: false }, pcConfig: pcConfig(),
  });
}

function answer() {
  if (!session) return log('No incoming call');
  log('Answer clicked - requesting microphone...');
  session.answer({ mediaConstraints: { audio: true, video: false }, pcConfig: pcConfig() });
}

function hangup() { if (session) session.terminate(); }
</script>
</body>
</html>
